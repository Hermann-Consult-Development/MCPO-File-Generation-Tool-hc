name: Build qualified HC chat images

on:
  push:
    tags: ['v*-hc.*']
  pull_request:
    paths:
      - LLM_Export/docker/mcpo/**
      - LLM_Export/docker/file_server/**
      - tests/**
      - .github/workflows/chat-containers.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: LLM_Export/docker/mcpo
            image: owui-mcpo
          - context: LLM_Export/docker/file_server
            image: owui-file-export-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed HC candidate
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/dockerfile.chat
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/hermann-consult-development/${{ matrix.image }}:${{ github.event_name == 'pull_request' && 'pr-validation' || github.ref_name }}
      - name: Verify actual MCPO image
        if: matrix.image == 'owui-mcpo'
        run: |
          docker run --rm --memory=4g --cpus=2 --network=none \
            --entrypoint /app/.venv/bin/python -e PYTHONPATH=/rootPath \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/LLM_Export/docker/file_server:/LLM_Export/docker/file_server:ro" \
            ghcr.io/hermann-consult-development/owui-mcpo:${{ github.event_name == 'pull_request' && 'pr-validation' || github.ref_name }} \
            -m unittest discover -s /tests -v
      - name: Publish reviewed fixed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push ghcr.io/hermann-consult-development/${{ matrix.image }}:${{ github.ref_name }}
      # Deliberately no latest/main/alpha promotion and no legacy SSE build.
