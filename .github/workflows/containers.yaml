name: Build & Push GHCR images

on:
  push:
    branches: [ master, main, dev, alpha, beta, release-candidate ]
    tags: [ 'v*', '!v*-hc.*' ]
  # Pull requests build and probe each image; only pushes publish tags.
  pull_request:
    paths:
      - LLM_Export/docker/**
      - .github/workflows/containers.yaml
      - .github/scripts/probe-image.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken image must not hold back the others.
      fail-fast: false
      matrix:
        include:
          - name: file-export-server
            context: LLM_Export/docker/file_server
            dockerfile: LLM_Export/docker/file_server/dockerfile.server
            image: ghcr.io/${{ github.repository_owner }}/owui-file-export-server
          - name: mcpo
            context: LLM_Export/docker/mcpo
            dockerfile: LLM_Export/docker/mcpo/dockerfile
            image: ghcr.io/${{ github.repository_owner }}/owui-mcpo
          - name: sse_http
            context: LLM_Export/docker/sse_http
            dockerfile: LLM_Export/docker/sse_http/dockerfile
            image: ghcr.io/${{ github.repository_owner }}/file-gen-sse-http
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Sanity check paths
        run: |
          pwd
          ls -la
          echo "---- LLM_Export ----"
          ls -la LLM_Export || true
          ls -la LLM_Export/docker || true
          ls -la LLM_Export/docker/file_server || true
          ls -la LLM_Export/docker/mcpo || true
          ls -la LLM_Export/docker/sse_http || true

      - uses: docker/setup-buildx-action@v3

      # A successful build does not mean the server starts (an unpinned
      # dependency once removed a module the SSE server imports, and the
      # broken image still became latest). Start it first; only an image
      # that answers is published.
      - name: Build for the start probe (${{ matrix.name }}, amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ci-probe/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Start probe (${{ matrix.name }})
        run: bash .github/scripts/probe-image.sh "${{ matrix.name }}" "ci-probe/${{ matrix.name }}:${{ github.sha }}"

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=alpha-latest,enable=${{github.ref == 'refs/heads/alpha'}}
            type=raw,value=beta-latest,enable=${{github.ref == 'refs/heads/beta'}}
            type=raw,value=dev-latest,enable=${{github.ref == 'refs/heads/dev'}}
            type=raw,value=rc-latest,enable=${{github.ref == 'refs/heads/release-candidate'}}


      - name: Build & Push (${{ matrix.name }})
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
